<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Stall</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14213d;--mute:#58627a;--line:#d6dce8;--acc:#0f8b8d;--on:#fff;--gain:#1f8a4c;--gainbg:#dff3e6;--loss:#c93a4f;--lossbg:#fbe4e8;--amb:#a96a05;--ambbg:#fbefd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#eef2fb;--mute:#9aa6c0;--line:#2d3a58;--acc:#3cc3c5;--on:#0f1624;--gain:#5fd18a;--gainbg:#16352a;--loss:#f2798b;--lossbg:#3b1b24;--amb:#f0b851;--ambbg:#3a2d12}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#eef2fb;--mute:#9aa6c0;--line:#2d3a58;--acc:#3cc3c5;--on:#0f1624;--gain:#5fd18a;--gainbg:#16352a;--loss:#f2798b;--lossbg:#3b1b24;--amb:#f0b851;--ambbg:#3a2d12}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 'Atkinson Hyperlegible',system-ui,sans-serif;padding:14px 14px 96px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.7rem;margin:4px 0 0}h2{font-size:1.1rem;margin:18px 0 8px}
.sub{color:var(--mute);margin:4px 0;font-size:.9rem}
.hero{padding:18px;border-radius:14px;margin:12px 0}.hero span{display:block;font-size:1rem}.hero b{font-size:3rem;line-height:1.1;display:block}.hero small{font-size:.9rem}
.gain{background:var(--gainbg);color:var(--gain)}.loss{background:var(--lossbg);color:var(--loss)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.mini span{display:block;color:var(--mute);font-size:.9rem}.mini b{font-size:1.4rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:12px;min-height:96px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile:active{background:var(--gainbg)}.tile:disabled{opacity:.55;border-color:var(--line);cursor:not-allowed}
.tile b{font-size:1.1rem}.tile span{font-size:1.25rem;color:var(--acc)}.low{color:var(--amb)}.bad{color:var(--loss)}
label{display:block;font-size:.9rem;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;min-height:48px;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.go,button.ghost{font:inherit;font-weight:700;min-height:48px;padding:10px 16px;border-radius:10px;cursor:pointer;margin-top:12px;width:100%}
button.go{background:var(--acc);color:var(--on);border:0}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
button.sm{font:inherit;min-height:44px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;background:var(--ambbg);color:var(--amb);font-size:.95rem}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border:0}
.empty{color:var(--mute);padding:10px 0}
textarea{min-height:90px;resize:vertical}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-top:1px solid var(--line)}td:last-child{text-align:right;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg button{font:inherit;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{font:inherit;min-height:60px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:.85rem}
nav button[aria-current="true"]{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
</style></head><body><main>
<div class="row"><h1 id="h1" style="flex:1">My Stall</h1><button class="sm" id="lg" data-act="lang">Setswana</button></div><p class="sub" id="hs">Your sales, costs, stock and profit in one place</p>
<div id="v"></div></main>
<nav><button data-tab="today">Today</button><button data-tab="stock">Stock</button><button data-tab="costs">Costs</button><button data-tab="report">Profit</button><button data-tab="diary">Diary</button></nav>
<script>
const $=s=>document.querySelector(s),ld=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
let S={cur:'$',items:[],sales:[],costs:[]},tab='today',per=0,note='',armed=0;
try{const d=JSON.parse(localStorage.getItem('stall1'));if(d&&d.items)S=d}catch(e){}
S.diary=S.diary||[];S.pays=S.pays||[];
S.lang=S.lang||((navigator.language||'').slice(0,2)=='tn'?'tn':'en');
const save=()=>{try{localStorage.setItem('stall1',JSON.stringify(S))}catch(e){}};
const m=n=>(n<0?'-':'')+S.cur+(Math.round(Math.abs(n)*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sm=(a,k)=>a.reduce((s,x)=>s+x[k],0),num=id=>parseFloat($('#'+id).value),nt=()=>note?'<div class="msg">'+note+'</div>':'';
function vToday(){const t=ld(),ss=S.sales.filter(x=>x.d==t),inn=sm(ss,'rev'),cg=sm(ss,'cost'),oc=sm(S.costs.filter(x=>x.d==t),'amt'),pr=inn-cg-oc;
return `<div class="hero ${pr<0?'loss':'gain'}"><span>Profit today</span><b>${m(pr)}</b><small>${pr<0?'You are behind today':'What you keep after all costs'}</small></div>
<div class="two"><div class="mini"><span>Money in</span><b>${m(inn)}</b></div><div class="mini"><span>Costs</span><b>${m(cg+oc)}</b></div></div>
<h2>Tap an item each time you sell one</h2>`+nt()+crUI()+(S.items.length?`<div class="tiles">${S.items.map(i=>`<button class="tile" data-act="sell" data-id="${i.id}" ${i.qty<1?'disabled':''}><b>${esc(i.name)}</b><span>${m(i.price)}</span><small class="${i.qty<1?'bad':i.qty<=3?'low':''}">${i.qty<1?'Sold out. Add stock.':i.qty+' left'+(i.qty<=3?', running low':'')}</small></button>`).join('')}</div>`:'<p class="empty">No items yet. Open the Stock tab and add what you sell.</p>')+(ss.length?`<button class="ghost" data-act="undo">Undo last sale (${esc(S.sales[S.sales.length-1].name)})</button>`:'')+`<p class="sub">Sales made today: ${ss.length}</p>`+owedUI()+bkUI()}
function vStock(){return `<h2>Add something you sell</h2><div class="card"><label for="n">Name</label><input id="n" placeholder="e.g. Roasted corn"><div class="two"><div><label for="c">It costs you (each)</label><input id="c" type="number" inputmode="decimal" min="0"></div><div><label for="p">You sell it for (each)</label><input id="p" type="number" inputmode="decimal" min="0"></div></div><label for="q">How many do you have now?</label><input id="q" type="number" inputmode="numeric" min="0"><button class="go" data-act="additem">Save item</button></div>`+nt()+`<h2>Your stock</h2><div class="card">`+(S.items.length?S.items.map(i=>`<div class="item"><b>${esc(i.name)}</b> <span class="${i.qty<1?'bad':i.qty<=3?'low':''}">${i.qty} left</span><div class="sub">Costs ${m(i.cost)}, sells for ${m(i.price)}. You earn ${m(i.price-i.cost)} each.</div>${i.price<i.cost?`<div class="msg" style="background:var(--lossbg);color:var(--loss)">You lose ${m(i.cost-i.price)} on every sale. Raise the price.</div>`:''}<div class="row"><input id="s${i.id}" type="number" inputmode="numeric" min="1" placeholder="How many to add?" aria-label="Add stock to ${esc(i.name)}"><button class="sm" data-act="addstock" data-id="${i.id}">Add stock</button><button class="sm" data-act="rm" data-id="${i.id}" aria-label="Remove ${esc(i.name)}">Remove</button></div></div>`).join(''):'<p class="empty">Nothing here yet.</p>')+'</div>'}
function vCosts(){const r=S.costs.map((c,i)=>[c,i]).reverse().slice(0,20);return `<h2>Money you spent on the stall</h2><p class="sub">Rent, fuel, transport and so on. Do not add the cost of the items you sell. That is counted for you.</p><div class="card"><label for="ck">What for?</label><select id="ck"><option>Rent</option><option>Fuel</option><option>Transport</option><option>Food</option><option>Supplies</option><option>Other</option></select><label for="ca">How much?</label><input id="ca" type="number" inputmode="decimal" min="0"><button class="go" data-act="addcost">Save cost</button></div>`+nt()+`<h2>Recent costs</h2><div class="card">`+(r.length?r.map(([c,i])=>`<div class="item row"><div style="flex:1"><b>${esc(c.what)}</b> ${m(c.amt)}<div class="sub">${c.d}</div></div><button class="sm" data-act="delcost" data-i="${i}" aria-label="Delete this cost">Delete</button></div>`).join(''):'<p class="empty">No costs saved yet.</p>')+'</div>'}
function vReport(){const n=[1,7,30][per],f=ld(ago(n-1)),ss=S.sales.filter(x=>x.d>=f),inn=sm(ss,'rev'),cg=sm(ss,'cost'),oc=sm(S.costs.filter(x=>x.d>=f),'amt'),pr=inn-cg-oc,g={};
ss.forEach(x=>{g[x.name]=g[x.name]||{u:0,p:0};g[x.name].u++;g[x.name].p+=x.rev-x.cost});const b=Object.entries(g).sort((a,c)=>c[1].p-a[1].p).slice(0,3);
return `<h2>How am I doing?</h2><div class="seg">${['Today','Last 7 days','Last 30 days'].map((l,i)=>`<button data-act="per" data-v="${i}" aria-pressed="${i==per}">${l}</button>`).join('')}</div>
<div class="hero ${pr<0?'loss':'gain'}"><span>${pr<0?'You lost':'You made a profit of'}</span><b>${m(Math.abs(pr))}</b><small>${pr<0?'Check your prices and costs.':'Money you keep after all costs.'}</small></div>
<div class="card"><table><tr><td>Money from sales</td><td>${m(inn)}</td></tr><tr><td>Cost of items you sold</td><td>${m(cg)}</td></tr><tr><td>Other costs (rent, fuel...)</td><td>${m(oc)}</td></tr><tr><td>${pr<0?'Loss':'Profit'}</td><td>${m(pr)}</td></tr></table>${owed().length?`<p class="sub">Customers still owe you ${m(sm(owed(),'a'))}. This is already counted in your profit.</p>`:''}</div>
<h2>Best sellers</h2><div class="card">${b.length?b.map(([k,v])=>`<div class="item"><b>${esc(k)}</b>: ${v.u} sold, earned ${m(v.p)}</div>`).join(''):'<p class="empty">No sales in this time yet.</p>'}</div>
${bkCard()}<div class="card"><label for="cur">Money symbol</label><input id="cur" value="${esc(S.cur)}" maxlength="4"><button class="ghost" data-act="clear">${armed?'Tap again to delete everything':'Delete all my data'}</button></div>`}
const NV={today:['Today','Gompieno'],stock:['Stock','Setoko'],costs:['Costs','Dituelo'],report:['Profit','Poelo'],diary:['Diary','Buka']};
const TN={'Profit today':'Poelo ya gompieno','You are behind today':'Gompieno o latlhegelwa','What you keep after all costs':'Se o setseng naso morago ga ditshenyegelo tsotlhe','Money in':'Tshelete e e tsenang','Costs':'Ditshenyegelo','Tap an item each time you sell one':'Tobetsa selo nako le nako fa o rekisa e le nngwe','Sold out. Add stock.':'E fedile. Oketsa setoko.','No items yet. Open the Stock tab and add what you sell.':'Ga go na dilo gone. Bula Setoko o tsenye se o se rekisang.','Add something you sell':'Tsenya se o se rekisang','Name':'Leina','e.g. Roasted corn':'e.g. Mmidi o o besitsweng','It costs you (each)':'O e reka ka bokae (nngwe le nngwe)','You sell it for (each)':'O e rekisa ka bokae (nngwe le nngwe)','How many do you have now?':'O na le di kae jaanong?','Save item':'Boloka selo','Your stock':'Setoko sa gago','Nothing here yet.':'Ga go na sepe fano gone.','How many to add?':'O batla go oketsa di kae?','Add stock':'Oketsa setoko','Remove':'Tlosa','Money you spent on the stall':'Tshelete e o e dirisitseng mo lebenkeleng','Rent, fuel, transport and so on. Do not add the cost of the items you sell. That is counted for you.':'Rente, petrole, dipalangwa le tse dingwe. O seka wa tsenya theko ya dilo tse o di rekisang. Seo se balelwa ka bosona.','What for?':'Ke ya eng?','How much?':'Ke bokae?','Save cost':'Boloka tshenyegelo','Recent costs':'Ditshenyegelo tsa bosheng','No costs saved yet.':'Ga go na tshenyegelo e e bolokilweng.','Delete':'Phimola','Rent':'Rente','Fuel':'Petrole','Transport':'Dipalangwa','Food':'Dijo','Supplies':'Dilo tsa go dira','Other':'Tse dingwe','How am I doing?':'Ke tsamaya jang?','Today':'Gompieno','Last 7 days':'Malatsi a le 7 a a fetileng','Last 30 days':'Malatsi a le 30 a a fetileng','You lost':'O latlhegetswe ke','You made a profit of':'O dirile poelo ya','Check your prices and costs.':'Lebelela ditheko le ditshenyegelo tsa gago.','Money you keep after all costs.':'Tshelete e o nnileng nayo morago ga ditshenyegelo tsotlhe.','Money from sales':'Tshelete ya dithekiso','Cost of items you sold':'Ditshenyegelo tsa dilo tse o di rekisitseng','Other costs (rent, fuel...)':'Ditshenyegelo tse dingwe (rente, petrole...)','Loss':'Tatlhegelo','Profit':'Poelo','Best sellers':'Tse di rekisiwang thata','No sales in this time yet.':'Ga go na dithekiso mo nakong eno.','Money symbol':'Letshwao la tshelete','Delete all my data':'Phimola tshedimosetso yotlhe ya me','Tap again to delete everything':'Tobetsa gape gore o phimole tsotlhe','End of day summary':'Kakaretso ya bofelo jwa letsatsi','Sales made':'Dithekiso tse di dirilweng','Anything to remember about today? (optional)':'A go na le sepe se o batlang go se gakologelwa ka gompieno? (ga se tlhokege)','Weather, customers, problems...':'Boso, bareki, mathata...','Save summary':'Boloka kakaretso','Update summary':'Ntshafatsa kakaretso','Write a note':'Kwala sengwe','A supplier price, a debt, an idea...':'Theko ya morekisi, molato, kgopolo...','Save note':'Boloka se o se kwadileng','My diary':'Buka ya me ya letsatsi','Your summaries and notes will appear here.':'Dikakaretso le dikwalo tsa gago di tla bonala fano.','Note':'Kwalo','Delete this entry':'Phimola se','Delete this cost':'Phimola tshenyegelo eno','Saved.':'E bolokilwe.','Note saved.':'Se se kwadilweng se bolokilwe.','Write something first.':'Kwala sengwe pele.','Please enter how much you spent.':'Tsenya gore o dirisitse bokae.','Please enter a name, what it costs you and what you sell it for.':'Tsenya leina, theko ya go reka le theko ya go rekisa.','Saved. But you sell this for less than it costs you.':'E bolokilwe. Mme o e rekisa ka tlase ga se o e rekileng ka sone.'};
Object.assign(TN,{'Keep your records safe':'Sireletsa tshedimosetso ya gago','Save a backup file and send it to yourself on WhatsApp or email. If you lose your phone, load the file on a new phone to get everything back.':'Boloka faele ya polokelo o e iromele WhatsApp kgotsa email. Fa o latlhegelwa ke founo, tsenya faele eno mo founong e ntšha o bone tsotlhe gape.','Last backup: never':'Kopi ya bofelo: ga ise e ko e bolokwe','Last backup: today':'Kopi ya bofelo: gompieno','Save backup':'Boloka kopi ya polokelo','Save backup now':'Boloka kopi ya polokelo jaanong','Restore from a backup file':'Busetsa go tswa mo faeleng ya polokelo','Replace my records':'Fetola tshedimosetso ya me ka eno','Cancel':'Khansela','Records restored.':'Tshedimosetso e busediwe.','This file is not a My Stall backup.':'Faele eno ga se kopi ya polokelo ya Lebenkele la me.','Backup saved. Keep the file somewhere safe, like WhatsApp or email to yourself.':'Kopi ya polokelo e bolokilwe. Boloka faele mo lefelong le le sireletsegileng, jaaka WhatsApp kgotsa email ya gago.','You have not saved a backup yet. Save one so your records are safe if your phone is lost.':'Ga o ise o boloke kopi ya polokelo. Boloka e le gore tshedimosetso ya gago e sireletsege fa founo e latlhega.','Your phone has marked these records as protected.':'Founo ya gago e tlhophile tshedimosetso eno jaaka e e sireletsegileng.','Your phone may delete these records if its space runs low, so save backups often.':'Founo ya gago e ka phimola tshedimosetso eno fa lefelo le tlhaela, ka jalo boloka dikopi gantsi.'});
Object.assign(TN,{'Customer will pay later':'Moreki o tla duela morago','Customer name':'Leina la moreki','Write the customer name first.':'Kwala leina la moreki pele.','Customers who owe you':'Bareki ba ba go kolotang','Record payment':'Kwala tuelo','Paid everything':'O duetse tsotlhe','How much did they pay?':'O duetse bokae?','Write how much the customer paid.':'Kwala gore moreki o duetse bokae.'});
const RX=[[/^Your last backup was (\d+) days ago\. Save one so your records are safe if your phone is lost\.$/,(a,n)=>'Kopi ya gago ya bofelo e ne ya bolokwa malatsi a '+n+' a a fetileng. Boloka e nngwe e le gore tshedimosetso ya gago e sireletsege fa founo e latlhega.'],[/^Last backup: (\d+) days ago$/,(a,n)=>'Kopi ya bofelo: malatsi a '+n+' a a fetileng'],[/^Backup found: (\d+) items, (\d+) sales, (\d+) costs\. This will replace your current records\.$/,(a,i,s,c)=>'Kopi e bonwe: dilo '+i+', dithekiso '+s+', ditshenyegelo '+c+'. Seo se tla fetola tshedimosetso ya gago ya jaanong.'],[/^Owes you (.+)$/,(a,x)=>'O go kolota '+x],[/^Total owed to you: (.+)$/,(a,x)=>'Tshelete yotlhe e o e kolotwang: '+x],[/^Customers still owe you (.+?)\. This is already counted in your profit\.$/,(a,x)=>'Bareki ba santse ba go kolota '+x+'. Seo se setse se balelwe mo poelong ya gago.'],[/^(\d+) left(, running low)?$/,(a,n,l)=>n+' e setseng'+(l?', e batla e fela':'')],[/^Costs (.+?), sells for (.+?)\. You earn (.+?) each\.$/,(a,c,p,e)=>'E reka ka '+c+', e rekisa ka '+p+'. O dira poelo ya '+e+' nngwe le nngwe.'],[/^You lose (.+?) on every sale\. Raise the price\.$/,(a,x)=>'O latlhegelwa ke '+x+' mo thekisong nngwe le nngwe. Oketsa theko.'],[/^Undo last sale \((.*)\)$/,(a,x)=>'Busetsa morago thekiso ya bofelo ('+x+')'],[/^Sales made today: (\d+)$/,(a,n)=>'Dithekiso tsa gompieno: '+n],[/^Best seller: (.*)$/,(a,x)=>'Se se rekisiwang thata: '+x],[/^Running low: (.*)$/,(a,x)=>'Se se batlang se fela: '+x],[/^: (\d+) sold, earned (.+)$/,(a,n,p)=>': di rekisitswe '+n+', poelo ya '+p],[/^Money in (.+?), costs (.+?), (profit|loss) (.+?), (\d+) sales(?:, best: (.*))?$/,(a,i,c,k,p,n,b)=>'Tshelete e e tsenang '+i+', ditshenyegelo '+c+', '+(k=='loss'?'tatlhegelo ':'poelo ')+p+', dithekiso '+n+(b?', se se rekisiwang thata: '+b:'')],[/^(Day summary|Note), (.+)$/,(a,k,d)=>(k=='Note'?'Kwalo':'Kakaretso ya letsatsi')+', '+d],[/^Add stock to (.*)$/,(a,x)=>'Oketsa setoko ya '+x],[/^Remove (.+)$/,(a,x)=>'Tlosa '+x]];
function tx(s){const t=s.trim();if(!t)return s;let r=TN[t];if(r===undefined)for(const[x,f]of RX)if(x.test(t)){r=t.replace(x,f);break}return r===undefined?s:s.replace(t,()=>r)}
function tr(el){if(S.lang!='tn')return;const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())n.nodeValue=tx(n.nodeValue);el.querySelectorAll('[placeholder],[aria-label]').forEach(e=>['placeholder','aria-label'].forEach(a=>{if(e.hasAttribute(a))e.setAttribute(a,tx(e.getAttribute(a)))}))}
function head(){const L=S.lang=='tn';$('#h1').textContent=L?'Lebenkele la me':'My Stall';$('#hs').textContent=L?'Dithekiso, ditshenyegelo, setoko le poelo mo lefelong le le lengwe':'Your sales, costs, stock and profit in one place';$('#lg').textContent=L?'English':'Setswana';document.documentElement.lang=L?'tn':'en';document.title=L?'Lebenkele la me':'My Stall'}
let cr=false,crw='';
function owed(){const g={};S.sales.forEach(x=>{if(x.who){const k=x.who.toLowerCase();g[k]=g[k]||{n:x.who,a:0};g[k].a+=x.rev}});S.pays.forEach(p=>{const k=p.who.toLowerCase();if(g[k])g[k].a-=p.amt});return Object.values(g).filter(c=>c.a>0.004)}
function crUI(){return `<label class="row" style="margin:6px 0"><input type="checkbox" id="cr" ${cr?'checked':''} style="width:28px;min-height:28px;flex:none"> <span>Customer will pay later</span></label>`+(cr?`<input id="cw" list="cl" placeholder="Customer name" aria-label="Customer name" value="${esc(crw)}" style="margin-bottom:10px"><datalist id="cl">${owed().map(c=>`<option value="${esc(c.n)}">`).join('')}</datalist>`:'')}
function owedUI(){const o=owed();if(!o.length)return'';return `<h2>Customers who owe you</h2><p class="sub">Total owed to you: ${m(sm(o,'a'))}</p>`+o.map(c=>`<div class="card"><div><b>${esc(c.n)}</b></div><div class="sub">Owes you ${m(c.a)}</div><div class="row"><input type="number" inputmode="decimal" min="0" placeholder="How much did they pay?" aria-label="How much did they pay?"><button class="sm" data-act="pay" data-w="${esc(c.n)}">Record payment</button></div><button class="ghost" data-act="pay" data-all="1" data-w="${esc(c.n)}">Paid everything</button></div>`).join('')}
let pend=null,persisted=null;
function bkUI(){if(!(S.sales.length||S.items.length))return'';const d=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;if(d!==null&&d<7)return'';return `<div class="msg" style="margin-top:14px">${d===null?'You have not saved a backup yet. Save one so your records are safe if your phone is lost.':'Your last backup was '+d+' days ago. Save one so your records are safe if your phone is lost.'}<button class="ghost" data-act="backup" style="margin-top:8px">Save backup now</button></div>`}
function bkCard(){const d=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;return `<div class="card">${nt()}<h2 style="margin-top:0">Keep your records safe</h2><p class="sub">Save a backup file and send it to yourself on WhatsApp or email. If you lose your phone, load the file on a new phone to get everything back.</p><p class="sub">${d===null?'Last backup: never':d==0?'Last backup: today':'Last backup: '+d+' days ago'}</p><button class="go" data-act="backup">Save backup</button><label for="rf">Restore from a backup file</label><input id="rf" type="file" accept=".txt,.json,text/plain,application/json">`+(pend?`<div class="msg">Backup found: ${pend.items.length} items, ${pend.sales.length} sales, ${pend.costs.length} costs. This will replace your current records.</div><button class="go" data-act="restore">Replace my records</button><button class="ghost" data-act="cancelrestore">Cancel</button>`:'')+`<p class="sub">${persisted?'Your phone has marked these records as protected.':'Your phone may delete these records if its space runs low, so save backups often.'}</p></div>`}
function doBackup(){const txt=JSON.stringify({app:'my-stall',v:1,saved:Date.now(),data:S}),name='my-stall-backup-'+ld()+'.txt';
const done=()=>{S.lastBackup=Date.now();note='Backup saved. Keep the file somewhere safe, like WhatsApp or email to yourself.';save();render()};
const anchor=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();done()};
const share=()=>{try{const f=new File([txt],name,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:'My Stall backup'}).then(done,e=>{if(!e||e.name!='AbortError')anchor()})}catch(e){}anchor()};
let c=null;try{c=window.claude&&claude.use?claude.use('downloads'):null}catch(e){}
if(c)c.then(d=>d?d.save({filename:name,data:txt}).then(done,e=>{if(!e||e.code!='declined')share()}):share(),()=>share());else share()}
function dayStats(t){const ss=S.sales.filter(x=>x.d==t),inn=sm(ss,'rev'),cg=sm(ss,'cost'),oc=sm(S.costs.filter(x=>x.d==t),'amt'),g={};ss.forEach(x=>g[x.name]=(g[x.name]||0)+1);const b=Object.entries(g).sort((a,c)=>c[1]-a[1])[0];return{n:ss.length,inn,cost:cg+oc,pr:inn-cg-oc,best:b?b[0]:'',low:S.items.filter(i=>i.qty<=3).map(i=>i.name)}}
function vDiary(){const t=ld(),s=dayStats(t),done=S.diary.find(x=>x.k=='day'&&x.d==t);
return `<h2>End of day summary</h2><div class="card"><p style="margin:0 0 6px"><b>${t}</b></p><table><tr><td>Sales made</td><td>${s.n}</td></tr><tr><td>Money in</td><td>${m(s.inn)}</td></tr><tr><td>Costs</td><td>${m(s.cost)}</td></tr><tr><td>${s.pr<0?'Loss':'Profit'}</td><td>${m(s.pr)}</td></tr></table>${s.best?`<p class="sub">Best seller: ${esc(s.best)}</p>`:''}${s.low.length?`<p class="sub low">Running low: ${s.low.map(esc).join(', ')}</p>`:''}<label for="dn">Anything to remember about today? (optional)</label><textarea id="dn" placeholder="Weather, customers, problems...">${done?esc(done.note):''}</textarea><button class="go" data-act="daysave">${done?'Update summary':'Save summary'}</button></div>
<h2>Write a note</h2><div class="card"><textarea id="nn" aria-label="Note" placeholder="A supplier price, a debt, an idea..."></textarea><button class="go" data-act="notesave">Save note</button></div>`+nt()+`<h2>My diary</h2>`+(S.diary.length?S.diary.map((x,i)=>[x,i]).reverse().map(([x,i])=>`<div class="card"><div class="row"><b style="flex:1">${x.k=='day'?'Day summary':'Note'}, ${x.d}</b><button class="sm" data-act="deldiary" data-i="${i}" aria-label="Delete this entry">Delete</button></div>${x.k=='day'?`<div class="sub">Money in ${m(x.inn)}, costs ${m(x.cost)}, ${x.pr<0?'loss':'profit'} ${m(Math.abs(x.pr))}, ${x.n} sales${x.best?', best: '+esc(x.best):''}</div>${x.note?`<p>${esc(x.note)}</p>`:''}`:`<p style="white-space:pre-wrap;margin:6px 0 0">${esc(x.text)}</p>`}</div>`).join(''):'<p class="empty">Your summaries and notes will appear here.</p>')}
function render(){document.querySelectorAll('nav button').forEach(b=>{b.setAttribute('aria-current',b.dataset.tab==tab);b.textContent=NV[b.dataset.tab][S.lang=='tn'?1:0]});head();$('#v').innerHTML=({today:vToday,stock:vStock,costs:vCosts,report:vReport,diary:vDiary})[tab]();tr($('#v'));note=''}
const A={
sell(e){const i=S.items.find(x=>x.id==e.dataset.id);if(!i||i.qty<1)return;if(cr&&!crw.trim()){note='Write the customer name first.';return}i.qty--;S.sales.push({d:ld(),id:i.id,name:i.name,rev:i.price,cost:i.cost,...(cr?{who:crw.trim()}:{})})},
backup(){doBackup()},
restore(){if(!pend)return;S={lang:S.lang,cur:'$',items:[],sales:[],costs:[],diary:[],pays:[],...pend};pend=null;note='Records restored.'},
cancelrestore(){pend=null},
pay(e){const w=e.dataset.w,c=owed().find(x=>x.n.toLowerCase()==w.toLowerCase());if(!c)return;const v=e.dataset.all?c.a:parseFloat(e.parentNode.querySelector('input').value);if(!(v>0)){note='Write how much the customer paid.';return}S.pays.push({d:ld(),who:c.n,amt:Math.min(v,c.a)})},
undo(){const s=S.sales.pop();if(!s)return;const i=S.items.find(x=>x.id==s.id);if(i)i.qty++},
additem(){const n=$('#n').value.trim(),c=num('c'),p=num('p'),q=Math.max(0,Math.floor(num('q'))||0);if(!n||!(p>0)||isNaN(c)||c<0){note='Please enter a name, what it costs you and what you sell it for.';return}S.items.push({id:Date.now(),name:n,cost:c,price:p,qty:q});note=p<c?'Saved. But you sell this for less than it costs you.':''},
addstock(e){const v=Math.floor(num('s'+e.dataset.id));const i=S.items.find(x=>x.id==e.dataset.id);if(i&&v>0)i.qty+=v},
rm(e){S.items=S.items.filter(x=>x.id!=e.dataset.id)},
addcost(){const a=num('ca');if(!(a>0)){note='Please enter how much you spent.';return}S.costs.push({d:ld(),what:$('#ck').value,amt:a})},
delcost(e){S.costs.splice(+e.dataset.i,1)},
per(e){per=+e.dataset.v},
lang(){S.lang=S.lang=='tn'?'en':'tn';if(S.lang=='tn'&&S.cur=='$')S.cur='P'},
daysave(){const t=ld(),s=dayStats(t),r={k:'day',d:t,n:s.n,inn:s.inn,cost:s.cost,pr:s.pr,best:s.best,note:$('#dn').value.trim()},i=S.diary.findIndex(x=>x.k=='day'&&x.d==t);i<0?S.diary.push(r):S.diary[i]=r;note='Saved.'},
notesave(){const v=$('#nn').value.trim();if(!v){note='Write something first.';return}S.diary.push({k:'note',d:ld(),text:v});note='Note saved.'},
deldiary(e){S.diary.splice(+e.dataset.i,1)},
clear(){if(!armed){armed=1;return}armed=0;S={lang:S.lang,cur:S.cur,items:[],sales:[],costs:[],diary:[],pays:[]}}};
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;armed=0}else{if(t.dataset.act!='clear')armed=0;A[t.dataset.act](t)}save();render()});
document.addEventListener('input',ev=>{if(ev.target.id=='cw')crw=ev.target.value});
document.addEventListener('change',ev=>{if(ev.target.id=='rf'){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data;if(j.app!='my-stall'||!d||!Array.isArray(d.items)||!Array.isArray(d.sales)||!Array.isArray(d.costs))throw 0;pend=d;note=''}catch(e){pend=null;note='This file is not a My Stall backup.'}render()};r.readAsText(f);return}if(ev.target.id=='cr'){cr=ev.target.checked;render();return}if(ev.target.id=='cur'){S.cur=ev.target.value||'$';save();render()}});
try{navigator.storage.persist().then(r=>{persisted=r;if(tab=='report')render()}).catch(()=>{})}catch(e){}
render();
</script></body></html>
